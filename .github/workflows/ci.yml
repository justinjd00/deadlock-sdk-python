name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Sync client matches the async source
        run: uv run python scripts/unasync.py --check

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: windows-latest
          - python: '3.13'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel without dev dependencies and smoke test it
        run: |
          uv venv /tmp/smoke --python 3.10
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import deadlock_sdk, deadlock_sdk.types; print(deadlock_sdk.__version__)"
          /tmp/smoke/bin/deadlock-py --version
