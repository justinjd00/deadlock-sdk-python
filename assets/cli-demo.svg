<svg xmlns="http://www.w3.org/2000/svg" width="860" height="943" viewBox="0 0 860 943" role="img" aria-labelledby="t" xml:space="preserve">
  <title id="t">deadlock-py CLI: tier list, hero matchups and Steam id conversion, run against the live Deadlock API</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 14px; white-space: pre; fill: #d8d1c2; }
    .p { fill: #e8b35c; font-weight: 700; } .c { fill: #fbf6ea; font-weight: 600; }
    .h { fill: #7fb2ff; } .k { fill: #6fd3b4; } .t { fill: #8d8574; }
    .s { fill: #f2c46d; font-weight: 700; } .a { fill: #c9a7ff; font-weight: 700; } .b { fill: #7fb2ff; font-weight: 700; }
    .g { fill: #6fd3b4; } .r { fill: #ef7a6a; }
    .blk { opacity: 0; animation: in .5s ease-out forwards; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blk { opacity: 1; animation: none; } .cur { animation: none; } }
  </style>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16140f"/><stop offset="1" stop-color="#0c0b09"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="941" rx="12" fill="url(#win)" stroke="#3a3326"/>
  <rect x="1" y="1" width="858" height="38" rx="12" fill="#1f1b14"/>
  <rect x="1" y="27" width="858" height="12" fill="#1f1b14"/>
  <line x1="1" y1="39" x2="859" y2="39" stroke="#3a3326"/>
  <circle cx="24" cy="20" r="6" fill="#ef7a6a"/><circle cx="44" cy="20" r="6" fill="#e8b35c"/><circle cx="64" cy="20" r="6" fill="#6fd3b4"/>
  <text x="430.0" y="25" text-anchor="middle" class="t" style="font-size:13px">pip install deadlock-sdk · live data</text>
