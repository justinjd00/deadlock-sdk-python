<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">deadlock-sdk</title>
  <desc id="desc">Typed Python SDK, sync and async, for the community Deadlock API</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rays { transform-origin: 1010px 250px; transform-box: view-box; animation: turn 60s linear infinite; }
    .flame { transform-origin: 1010px 250px; transform-box: view-box; animation: flicker 3.2s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.4s ease-out both; }
    .bar.b { animation-delay: .15s; } .bar.c { animation-delay: .3s; } .bar.d { animation-delay: .45s; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes flicker { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .rays, .flame, .blink, .bar { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c0a"/>
      <stop offset=".6" stop-color="#17140f"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d48f"/>
      <stop offset=".5" stop-color="#d9a24e"/>
      <stop offset="1" stop-color="#9c6b2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="1010" cy="250" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2a03d" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#f2a03d" stop-opacity=".08"/>
      <stop offset="1" stop-color="#f2a03d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset=".45" stop-color="#9fd0ff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f6d48f" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- Art deco sunburst -->
    <g class="rays" stroke="#e8b35c" stroke-opacity=".16" stroke-width="1.2">
      <line x1="1010" y1="250" x2="1010" y2="-60"/><line x1="1010" y1="250" x2="1130" y2="-36"/>
      <line x1="1010" y1="250" x2="1229" y2="31"/><line x1="1010" y1="250" x2="1296" y2="130"/>
      <line x1="1010" y1="250" x2="1320" y2="250"/><line x1="1010" y1="250" x2="1296" y2="370"/>
      <line x1="1010" y1="250" x2="1229" y2="469"/><line x1="1010" y1="250" x2="1130" y2="536"/>
      <line x1="1010" y1="250" x2="1010" y2="560"/><line x1="1010" y1="250" x2="890" y2="536"/>
      <line x1="1010" y1="250" x2="791" y2="469"/><line x1="1010" y1="250" x2="724" y2="370"/>
      <line x1="1010" y1="250" x2="700" y2="250"/><line x1="1010" y1="250" x2="724" y2="130"/>
      <line x1="1010" y1="250" x2="791" y2="31"/><line x1="1010" y1="250" x2="890" y2="-36"/>
    </g>

    <!-- Deco arch with a patron flame -->
    <g fill="none" stroke="url(#brass)">
      <path d="M900 360V230a110 110 0 0 1 220 0V360" stroke-width="2.4"/>
      <path d="M920 360V232a90 90 0 0 1 180 0V360" stroke-width="1.2" stroke-opacity=".7"/>
      <path d="M940 360V234a70 70 0 0 1 140 0V360" stroke-width="1" stroke-opacity=".45"/>
      <path d="M880 360V226m260 134V226" stroke-width="1" stroke-opacity=".5"/>
    </g>
    <g class="flame">
      <path d="M1010 186c22 26 34 46 34 66a34 34 0 0 1-68 0c0-14 6-24 14-34 2 12 8 18 14 18-6-16-2-32 6-50z" fill="url(#fire)" opacity=".92"/>
      <path d="M1010 226c10 12 16 22 16 30a16 16 0 0 1-32 0c0-8 6-16 16-30z" fill="#ffffff" opacity=".85"/>
    </g>
    <path d="M960 300h100M972 312h76M984 324h52" stroke="url(#brass)" stroke-width="1.4"/>

    <!-- Stat bars, like a scoreboard -->
    <g class="mono" font-size="12" fill="#a99d85">
      <text x="1150" y="78">S  54.6%</text>
      <text x="1150" y="100">A  53.5%</text>
      <text x="1150" y="122">B  51.2%</text>
      <text x="1150" y="144">C  49.0%</text>
    </g>
    <g>
      <rect class="bar" x="1150" y="84" width="96" height="3" rx="1.5" fill="#f2c46d"/>
      <rect class="bar b" x="1150" y="106" width="78" height="3" rx="1.5" fill="#c9a7ff"/>
      <rect class="bar c" x="1150" y="128" width="58" height="3" rx="1.5" fill="#7fb2ff"/>
      <rect class="bar d" x="1150" y="150" width="40" height="3" rx="1.5" fill="#8d8574"/>
    </g>

    <!-- Title block -->
    <g transform="translate(72 0)">
      <path d="M0 86h36M0 92h22" stroke="url(#brass)" stroke-width="2"/>
      <text x="48" y="94" class="mono" font-size="15" letter-spacing="3" fill="#e8b35c">PYTHON · ASYNC · PANDAS</text>
      <text x="0" y="178" class="sans" font-size="78" font-weight="800" letter-spacing="-2" fill="#fbf6ea">deadlock<tspan fill="url(#brass)">-sdk</tspan><tspan font-size="30" font-weight="600" fill="#7fb2ff" dx="14">.py</tspan></text>
      <text x="2" y="222" class="sans" font-size="22" fill="#cfc6b3">Players, matches, heroes, items and the meta,</text>
      <text x="2" y="252" class="sans" font-size="22" fill="#cfc6b3">typed, sync and async, from the Deadlock API.</text>
      <g transform="translate(2 286)">
        <rect width="330" height="40" rx="8" fill="#0b0a08" stroke="#3a3326"/>
        <text x="16" y="26" class="mono" font-size="15" fill="#e8b35c">❯ <tspan fill="#fbf6ea">pip install deadlock-sdk</tspan><tspan class="blink" fill="#e8b35c"> ▍</tspan></text>
      </g>
    </g>

    <!-- Deco frame -->
    <rect x="14" y="14" width="1252" height="332" rx="12" fill="none" stroke="#e8b35c" stroke-opacity=".28"/>
    <path d="M14 46V14h32M1234 14h32v32M1266 314v32h-32M46 346H14v-32" fill="none" stroke="url(#brass)" stroke-width="2.2"/>
  </g>
</svg>
