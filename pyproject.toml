[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deadlock-sdk"
dynamic = ["version"]
description = "Typed Python SDK (sync and async) for the community Deadlock API: players, matches, heroes, items, tier lists, counters and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Dewitz" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.7"]
keywords = ["deadlock", "deadlock-api", "valve", "steam", "sdk", "api-client", "game-stats", "async", "pandas"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.scripts]
deadlock-py = "deadlock_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/justinjd00/deadlock-sdk-python"
Documentation = "https://github.com/justinjd00/deadlock-sdk-python#readme"
Issues = "https://github.com/justinjd00/deadlock-sdk-python/issues"
Changelog = "https://github.com/justinjd00/deadlock-sdk-python/blob/main/CHANGELOG.md"
"TypeScript SDK" = "https://github.com/justinjd00/deadlock-sdk"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "mypy>=1.13",
  "ruff>=0.8",
  "pandas>=2",
  "pandas-stubs>=2",
  "build>=1.2",
  "twine>=6",
]

[tool.hatch.version]
path = "src/deadlock_sdk/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["contract: hits the live Deadlock API (run with -m contract)"]
addopts = "-m 'not contract'"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "deadlock_sdk._generated.*"
disable_error_code = ["misc", "overload-overlap"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/deadlock_sdk/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
